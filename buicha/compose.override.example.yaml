# 設定内容を示す例。web サービスの image を自前ビルドに差し替える。
# 要確認: サービス名を "web" と仮定している。実際の compose.yaml のサービス名を確認すること。
# 使い方: compose.yaml と同じディレクトリに compose.override.yaml として置くか、
#         compose.yaml の web.image を直接書き換える。
#
# ロールバック:
#   image を元の公式イメージ
#     misskey/misskey@sha256:5c90a0cf3ddf010580d30c21b43a345a636313eae96a97f7e56aed0544039480
#   に戻し（override を削除でも可）、`docker compose up -d web` を実行する。
services:
  web:
    image: buicha/misskey:2026.10.0-buicha.1
